<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-view="board" data-size="lg" data-pinned="false">
    <header class="chrome">
      <div class="chrome-left" data-tauri-drag-region>
        <span class="app-name" data-tauri-drag-region>Desk</span>
        <nav class="views">
          <button type="button" id="view-board" class="view-btn active">Board</button>
          <button type="button" id="view-clock" class="view-btn">Clock</button>
        </nav>
      </div>
      <div class="chrome-right">
        <span id="persistence-status" class="persistence-status hidden" role="status" aria-live="polite"></span>
        <button type="button" id="pin-btn" class="icon-btn" title="Pin" aria-label="Pin" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path fill="currentColor" d="M8.55 1.35a2.2 2.2 0 0 0-3.1 0l-.7.7a.6.6 0 0 0 0 .85l.2.2-2.35.94a.85.85 0 0 0-.32 1.38L4.4 7.54 2.15 9.8a.6.6 0 1 0 .85.85l2.25-2.26 2.12 2.12a.85.85 0 0 0 1.38-.32l.94-2.35.2.2a.6.6 0 0 0 .85 0l.7-.7a2.2 2.2 0 0 0 0-3.1L8.55 1.35Z"/>
          </svg>
        </button>
        <button type="button" id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings" aria-controls="settings-overlay" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 6.093A6.004 6.004 0 0 0 7.25 7.093l-2.19-.732c-.89-.297-1.87.144-2.247 1.013L1.56 9.99c-.377.87-.05 1.877.746 2.33l2.03 1.156a5.995 5.995 0 0 0 0 2.048l-2.03 1.156c-.796.454-1.123 1.46-.746 2.33l1.253 2.616c.376.869 1.357 1.31 2.247 1.013l2.19-.732a6.004 6.004 0 0 0 1.8 1l.178 2.276c.151.904.933 1.567 1.85 1.567h2.844c.917 0 1.699-.663 1.85-1.567l.178-2.276a6.004 6.004 0 0 0 1.8-1l2.19.732c.89.297 1.87-.144 2.247-1.013L22.44 17.01c.377-.87.05-1.877-.746-2.33l-2.03-1.156a5.995 5.995 0 0 0 0-2.048l2.03-1.156c.796-.454 1.123-1.46.746-2.33l-1.253-2.616c-.376-.869-1.357-1.31-2.247-1.013l-2.19.732a6.004 6.004 0 0 0-1.8-1l-.178-2.276c-.151-.904-.933-1.567-1.85-1.567h-2.844ZM12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z"/>
          </svg>
        </button>
        <button type="button" id="min-btn" class="icon-btn" title="Minimize" aria-label="Minimize">–</button>
        <button type="button" id="close-btn" class="icon-btn close" title="Close" aria-label="Close">×</button>
      </div>
    </header>

    <section id="board-view" class="view board-view">
      <form id="capture-form" class="capture">
        <input id="capture-input" placeholder="Capture" autocomplete="off" />
      </form>
      <div id="column-switch" class="column-switch"></div>
      <div id="board" class="board"></div>
      <div class="board-footer">
        <button type="button" id="archive-done">Archive Done</button>
        <button type="button" id="open-archive">Archive</button>
      </div>
    </section>

    <section id="clock-view" class="view clock-view hidden">
      <div class="clock-face">
        <button type="button" id="clock-digits" class="clock-digits" aria-label="Start or pause the clock">
          <span class="clock-hours" hidden></span>
          <span class="clock-mins">25</span>
          <span class="clock-sep">:</span>
          <span class="clock-secs">00</span>
        </button>
        <div id="clock-presets" class="clock-presets"></div>
        <form id="custom-duration" class="custom-duration">
          <input id="hours-input" type="number" min="0" max="24" step="1" placeholder="0" aria-label="Hours" />
          <span>h</span>
          <input id="mins-input" type="number" min="0" max="59" step="1" placeholder="25" aria-label="Minutes" />
          <span>min</span>
          <button type="submit">Set</button>
        </form>
        <p id="clock-duration-status" class="settings-status muted hidden" role="status" aria-live="polite"></p>
        <div class="clock-actions">
          <button type="button" id="timer-toggle" class="primary">Start</button>
          <button type="button" id="timer-reset">Reset</button>
        </div>
      </div>
      <div class="clock-progress" aria-hidden="true">
        <div id="clock-progress-fill"></div>
      </div>
    </section>

    <div id="archive-overlay" class="overlay hidden">
      <div class="overlay-card">
        <header>
          <h2>Archive</h2>
          <button type="button" id="close-archive">Close</button>
        </header>
        <ul id="archive-list"></ul>
      </div>
    </div>

    <div id="archive-confirm-overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="overlay-card settings-card">
        <p>Archive all cards in Done?</p>
        <div class="board-footer">
          <button type="button" id="archive-confirm-cancel">Cancel</button>
          <button type="button" id="archive-confirm-ok" class="primary">Archive Done</button>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="overlay-card settings-card">
        <header>
          <h2 id="settings-title">Settings</h2>
          <button type="button" id="close-settings">Close</button>
        </header>
        <label class="setting-row" for="autostart-toggle">
          <span>Launch Desk at login</span>
          <input id="autostart-toggle" type="checkbox" />
        </label>
        <p id="settings-autostart-status" class="settings-status muted" role="status" aria-live="polite"></p>
        <button type="button" id="show-data-folder" class="setting-row-button">Show data folder</button>
        <p id="settings-data-folder-status" class="settings-status muted" role="status" aria-live="polite"></p>
      </div>
    </div>
  </body>
</html>
